name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      exists: ${{ steps.release.outputs.exists }}
      version: ${{ steps.changelog.outputs.version }}
      tag: ${{ steps.changelog.outputs.tag }}
      prerelease: ${{ steps.changelog.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version and release notes
        id: changelog
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(grep -m1 -E '^## \[[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\]' CHANGELOG.md \
            | sed -E 's/^## \[//; s/\].*$//') || true

          if [ -z "$VERSION" ]; then
            echo "::error::CHANGELOG.md tidak memiliki versi SemVer yang siap dirilis."
            exit 1
          fi

          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          awk -v version="$VERSION" '
            BEGIN { found = 0 }
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md

          sed -i '/^[[:space:]]*$/N;/^\n$/D' release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "::error::Bagian CHANGELOG untuk ${VERSION} kosong."
            exit 1
          fi

          echo "Versi: ${VERSION}"
          echo "----- release notes -----"
          cat release_notes.md

      - name: Check existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.changelog.outputs.tag }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Release ${TAG} sudah ada."
            exit 0
          fi

          echo "exists=false" >> "$GITHUB_OUTPUT"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Tag ${TAG} sudah ada tetapi menunjuk ke commit berbeda (${TAG_SHA})."
              exit 1
            fi
          fi

      - name: Setup Go
        if: steps.release.outputs.exists == 'false'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Verify source
        if: steps.release.outputs.exists == 'false'
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "File Go belum diformat dengan gofmt:"
            echo "$files"
            exit 1
          fi
          go test ./...

  build:
    needs: verify
    if: needs.verify.outputs.exists == 'false'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: ''
          - os: windows-latest
            goos: windows
            goarch: amd64
            suffix: '.exe'
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Build release binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          name="klip-${GOOS}-${GOARCH}${{ matrix.suffix }}"
          flags=(-trimpath -buildvcs=false "-ldflags=-s -w -X main.version=${VERSION}")
          CGO_ENABLED=0 go build "${flags[@]}" -o "dist/${name}" ./cmd/klip

          size=$(stat -c '%s' "dist/${name}" 2>/dev/null || stat -f '%z' "dist/${name}")
          mb=$(awk "BEGIN { printf \"%.2f\", $size / 1024 / 1024 }")
          echo "Binary: ${name}: ${mb} MiB (${size} bytes)"

          if [ "$size" -gt 104857600 ]; then
            echo "::error::Binary melebihi batas keras 100 MiB."
            exit 1
          fi

          if [ "$size" -ge 52428800 ]; then
            echo "::warning::Binary mencapai atau melebihi target 50 MiB."
          fi

          sha256sum "dist/${name}" > "dist/${name}.sha256" 2>/dev/null || shasum -a 256 "dist/${name}" > "dist/${name}.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: klip-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [verify, build]
    if: needs.verify.outputs.exists == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: klip-*
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ needs.verify.outputs.prerelease }}" = "true" ]; then
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --notes-file release_notes.md \
              --target "$GITHUB_SHA" \
              --prerelease
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --notes-file release_notes.md \
              --target "$GITHUB_SHA"
          fi
