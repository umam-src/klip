name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Test
        run: go test ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build Linux binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags='-s -w' \
            -o dist/klip-linux-amd64 ./cmd/klip

          size=$(stat -c '%s' dist/klip-linux-amd64)
          mb=$(awk "BEGIN { printf \"%.2f\", $size / 1024 / 1024 }")
          echo "Binary: ${mb} MiB (${size} bytes)"

          if [ "$size" -gt 104857600 ]; then
            echo "Binary melebihi batas keras 100 MiB."
            exit 1
          fi

          if [ "$size" -ge 52428800 ]; then
            echo "Peringatan: binary mencapai atau melebihi target 50 MiB."
          else
            echo "OK: binary berada di bawah target 50 MiB."
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/klip-linux-amd64 --generate-notes
