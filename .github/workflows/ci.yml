name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "File Go belum diformat dengan gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Test
        run: go test ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Build Linux binary
        run: |
          mkdir -p dist
          flags=(-trimpath -buildvcs=false '-ldflags=-s -w')

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build "${flags[@]}" \
            -o dist/klip-linux-amd64 ./cmd/klip

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build "${flags[@]}" \
            -o dist/klip-linux-amd64-repro ./cmd/klip

          if ! cmp -s dist/klip-linux-amd64 dist/klip-linux-amd64-repro; then
            echo "Build release tidak reproducible."
            sha256sum dist/klip-linux-amd64 dist/klip-linux-amd64-repro
            exit 1
          fi
          rm dist/klip-linux-amd64-repro

          size=$(stat -c '%s' dist/klip-linux-amd64)
          mb=$(awk "BEGIN { printf \"%.2f\", $size / 1024 / 1024 }")
          echo "Binary: ${mb} MiB (${size} bytes)"

          if [ "$size" -gt 104857600 ]; then
            echo "Binary melebihi batas keras 100 MiB."
            exit 1
          fi

          if [ "$size" -ge 52428800 ]; then
            echo "Peringatan: binary mencapai atau melebihi target 50 MiB."
          else
            echo "OK: binary berada di bawah target 50 MiB."
          fi

      - name: Smoke test release binary
        run: |
          KLIP_DATA_DIR="$RUNNER_TEMP/klip-data"
          mkdir -p "$KLIP_DATA_DIR"
          ./dist/klip-linux-amd64 >"$RUNNER_TEMP/klip.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/health >/dev/null; then
              echo "Smoke test: /health berhasil."
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Klip berhenti sebelum health endpoint siap."
              cat "$RUNNER_TEMP/klip.log"
              exit 1
            fi
            sleep 0.2
          done

          echo "Klip tidak merespons /health dalam batas waktu."
          cat "$RUNNER_TEMP/klip.log"
          exit 1

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/klip-linux-amd64 --generate-notes
